name: Daily data update + deploy

on:
  schedule:
    - cron: '42 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_LIBS_USER: /home/runner/work/_temp/Library

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'
          use-public-rspm: true

      - name: Cache R packages
        uses: actions/cache@v3
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-pkgs-${{ runner.os }}-v3
          restore-keys: r-pkgs-

      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfreetype6-dev \
            libfontconfig1-dev

      - name: Install R packages
        run: |
          mkdir -p "$R_LIBS_USER"
          Rscript -e "
            .libPaths(Sys.getenv('R_LIBS_USER'))
            pkgs <- c('tidyverse','lubridate','httr','jsonlite',
                      'shiny','plotly','conflicted','rsconnect',
                      'rvest','readr','dplyr','purrr')
            installed <- rownames(installed.packages())
            new <- setdiff(pkgs, installed)
            if (length(new)) {
              install.packages(new,
                lib   = Sys.getenv('R_LIBS_USER'),
                repos = Sys.getenv('RSPM'))
            }
          "

      - name: Refresh data files
        run: |
          Rscript -e "
            .libPaths(c(Sys.getenv('R_LIBS_USER'), .libPaths()))
            source('update_pipeline.R')
          "

      - name: Commit data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

          # Save freshly generated CSVs to temp location
          mkdir -p /tmp/csv_backup
          cp data/*.csv /tmp/csv_backup/

          # Reset working tree to latest remote state (no merge conflicts)
          git fetch origin
          git reset --hard origin/main

          # Restore freshly generated CSVs
          cp /tmp/csv_backup/*.csv data/

          # Stage and commit only the CSVs
          git add data/*.csv
          if git diff --staged --quiet; then
            echo "No data changes - skipping commit"
          else
            git commit -m "chore: daily data refresh $(date -u +%Y-%m-%d)"
            git push origin HEAD
          fi

      - name: Verify global.R
        run: |
          echo "Line count of global.R:"
          wc -l global.R
          echo "Last 20 lines of global.R:"
          tail -20 global.R

      - name: Deploy to shinyapps.io
        env:
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          Rscript -e "
            .libPaths(c(Sys.getenv('R_LIBS_USER'), .libPaths()))
            rsconnect::setAccountInfo(
              name   = 'waterwater',
              token  = Sys.getenv('SHINYAPPS_TOKEN'),
              secret = Sys.getenv('SHINYAPPS_SECRET')
            )
            rsconnect::deployApp(
              appDir         = '.',
              appName        = 'yakima-storage',
              account        = 'waterwater',
              server         = 'shinyapps.io',
              forceUpdate    = TRUE,
              lint           = FALSE,
              launch.browser = FALSE
            )
          "
