name: Daily data update + deploy

on:
  schedule:
    - cron: '30 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_LIBS_USER: /home/runner/work/_temp/Library

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'
          use-public-rspm: true

      # Cache key bumped v3 -> v4 (and actions/cache v3 -> v4) so the runner
      # starts with a clean library that includes a Connect Cloud-capable rsconnect.
      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-pkgs-${{ runner.os }}-v4
          restore-keys: r-pkgs-${{ runner.os }}-v4

      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfreetype6-dev \
            libfontconfig1-dev

      # Installs pre-built Linux binaries from Posit Package Manager
      # (set up by 'use-public-rspm: true' above).
      - name: Install R packages
        run: |
          mkdir -p "$R_LIBS_USER"
          Rscript -e "
            .libPaths(c(Sys.getenv('R_LIBS_USER'), .libPaths()))
            cat('Using repos:', getOption('repos'), '\n')
            pkgs <- c('tidyverse','lubridate','httr','jsonlite',
                      'shiny','plotly','conflicted','rsconnect',
                      'rvest','readr','dplyr','purrr')
            installed <- rownames(installed.packages())
            new <- setdiff(pkgs, installed)
            if (length(new)) {
              install.packages(new, lib = Sys.getenv('R_LIBS_USER'))
            }
            # Connect Cloud needs a recent rsconnect - upgrade if the cached copy is old
            if (packageVersion('rsconnect') < '1.6.0') {
              install.packages('rsconnect', lib = Sys.getenv('R_LIBS_USER'))
            }
            # FAIL the step if any package did not install (install.packages only warns).
            # The app's packages MUST be installed here, or rsconnect leaves them out
            # of the bundle and the app cannot start on Connect Cloud.
            missing <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)]
            if (length(missing)) {
              stop('These packages failed to install: ', paste(missing, collapse = ', '))
            }
            cat('Packages ready:', paste(pkgs, collapse = ', '), '\n')
            cat('rsconnect version:', as.character(packageVersion('rsconnect')), '\n')
          "

      - name: Refresh data files
        run: |
          Rscript -e "
            .libPaths(c(Sys.getenv('R_LIBS_USER'), .libPaths()))
            source('update_pipeline.R')
          "

      - name: Commit data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          mkdir -p /tmp/csv_backup
          cp data/*.csv /tmp/csv_backup/
          git fetch origin
          git reset --hard origin/main
          cp /tmp/csv_backup/*.csv data/
          git add data/*.csv
          if git diff --staged --quiet; then
            echo "No data changes - skipping commit"
          else
            git commit -m "chore: daily data refresh $(date -u +%Y-%m-%d)"
            git push origin HEAD
          fi

      - name: Verify global.R
        run: |
          echo "Line count of global.R:"
          wc -l global.R
          echo "Last 20 lines of global.R:"
          tail -20 global.R

      # -- Deploy to Posit Connect Cloud ----------------------------------------
      # Secrets (Settings > Secrets and variables > Actions > Secrets tab):
      #   CONNECT_CLOUD_CLIENT_ID, CONNECT_CLOUD_CLIENT_SECRET
      # CONNECT_CONTENT_ID is the long ID at the end of the app's URL:
      #   https://connect.posit.cloud/waterwater/content/<content-id>
      - name: Deploy to Posit Connect Cloud
        env:
          CONNECT_CLIENT_ID:     ${{ secrets.CONNECT_CLOUD_CLIENT_ID }}
          CONNECT_CLIENT_SECRET: ${{ secrets.CONNECT_CLOUD_CLIENT_SECRET }}
          CONNECT_ACCOUNT:       'waterwater'
          CONNECT_CONTENT_ID:    '01a11941-1c1e-1a00-09c9-637a9612f2ae'
          APP_NAME:              'yakima-storage'
        run: |
          echo "=== global.R line count at deploy time ==="
          wc -l global.R
          echo "=== last 5 lines ==="
          tail -5 global.R
          Rscript -e "
            .libPaths(c(Sys.getenv('R_LIBS_USER'), .libPaths()))

            # Verify credentials are present
            if (Sys.getenv('CONNECT_CLIENT_ID') == '' || Sys.getenv('CONNECT_CLIENT_SECRET') == '') {
              stop('ERROR: CONNECT_CLOUD_CLIENT_ID or CONNECT_CLOUD_CLIENT_SECRET not configured')
            }

            account    <- Sys.getenv('CONNECT_ACCOUNT')
            content_id <- Sys.getenv('CONNECT_CONTENT_ID')
            app_name   <- Sys.getenv('APP_NAME')
            server     <- 'connect.posit.cloud'

            # Register Connect Cloud credentials on this (temporary) runner
            rsconnect::connectCloudClientCredentials(
              clientId     = Sys.getenv('CONNECT_CLIENT_ID'),
              clientSecret = Sys.getenv('CONNECT_CLIENT_SECRET'),
              accountName  = account,
              name         = NULL
            )

            # Build a deployment record so deployApp() updates the EXISTING
            # migrated app instead of creating a new one. This file lives only
            # on the runner - it is never committed (the commit step only adds data/*.csv).
            rec_dir <- file.path('rsconnect', server, account)
            dir.create(rec_dir, recursive = TRUE, showWarnings = FALSE)
            writeLines(c(
              paste0('name: ',     app_name),
              paste0('title: ',    app_name),
              paste0('username: ', account),
              paste0('account: ',  account),
              paste0('server: ',   server),
              paste0('hostUrl: https://api.', server, '/v1'),
              paste0('appId: ',    content_id)
            ), file.path(rec_dir, paste0(app_name, '.dcf')))

            # Retry logic for deployment.
            # deployApp() returns TRUE/FALSE instead of throwing an error when
            # the app fails to START on the server, so check its return value.
            max_attempts <- 3
            attempt <- 1

            while (attempt <= max_attempts) {
              ok <- tryCatch({
                result <- rsconnect::deployApp(
                  appDir         = '.',
                  appId          = content_id,
                  account        = account,
                  server         = server,
                  forceUpdate    = TRUE,
                  lint           = FALSE,
                  launch.browser = FALSE,
                  appFiles       = c(
                    'app.R',
                    'global.R',
                    'modules/mod_conditions.R',
                    'modules/mod_storage.R',
                    'modules/mod_explorer.R',
                    'modules/mod_forecast.R',
                    'www/styles.css',
                    'www/yakima_basin_map.png',
                    'data/yakima_swe_combined.csv',
                    'data/yakima_dam_daily.csv',
                    'data/ncei_climate_monthly.csv',
                    'data/yakima_swe_ce_seed.csv',
                    'data/nwrfc_runoff_monthly.csv',
                    'data/bor_discharge_monthly.csv'
                  )
                )
                isTRUE(result)
              }, error = function(e) {
                cat('Deployment attempt', attempt, 'failed:', conditionMessage(e), '\n')
                FALSE
              })
              if (ok) {
                cat('Deployment succeeded on attempt', attempt, '\n')
                break
              }
              if (attempt == max_attempts) {
                stop('Deployment failed after ', max_attempts, ' attempts')
              }
              Sys.sleep(30)
              attempt <- attempt + 1
            }
          "
