name: Daily data update + deploy

on:
  schedule:
    - cron: '42 5 * * *'
  workflow_dispatch:

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'
          use-public-rspm: true

      - name: Cache R packages
        uses: actions/cache@v3
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-pkgs-${{ runner.os }}-${{ hashFiles('**/DESCRIPTION') }}
          restore-keys: r-pkgs-${{ runner.os }}-

      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages
        run: |
          Rscript -e "
            pkgs <- c('tidyverse','lubridate','httr','jsonlite',
                      'shiny','plotly','conflicted','rsconnect',
                      'rvest','readr','dplyr','purrr')
            new <- pkgs[!(pkgs %in% installed.packages()[,'Package'])]
            if (length(new)) install.packages(new, repos='https://cloud.r-project.org')
          "

      - name: Refresh data files
        run: Rscript update_pipeline.R

      - name: Commit data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          if git diff --staged --quiet; then
            echo "No data changes - skipping commit"
          else
            git commit -m "chore: daily data refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Deploy to shinyapps.io
        env:
          SHINYAPPS_TOKEN:  ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          Rscript -e "
            rsconnect::setAccountInfo(
              name   = 'waterwater',
              token  = Sys.getenv('SHINYAPPS_TOKEN'),
              secret = Sys.getenv('SHINYAPPS_SECRET')
            )
            rsconnect::deployApp(
              appDir      = '.',
              appName     = 'yakima-storage',
              account     = 'waterwater',
              server      = 'shinyapps.io',
              forceUpdate = TRUE,
              launch.browser = FALSE
            )
          "
